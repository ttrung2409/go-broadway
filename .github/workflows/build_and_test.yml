name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      
    - name: Set up Go 1.24
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: true
        
    - name: Install dependencies
      run: go mod download
      
    - name: Build
      run: go build -v ./...
      
    - name: Build examples
      run: go build -v ./examples/...
      
    - name: Verify no build constraints are broken
      run: |
        go env -w CGO_ENABLED=0
        go build -v ./...
    
    # Upload workspace artifact for use in downstream jobs
    - name: Upload workspace
      uses: actions/upload-artifact@v4
      with:
        name: workspace
        path: |
          .
          !.git/**
          !**/.git/**
        retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=3m

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Download workspace
      uses: actions/download-artifact@v4
      with:
        name: workspace
        path: .

    - name: Set up Go 1.24
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: true

    - name: Install dependencies
      run: go mod verify

    # Create a directory for test cache
    - name: Create test cache directory
      run: mkdir -p .test-cache

    # Cache test results between runs
    - uses: actions/cache@v4
      with:
        path: .test-cache
        key: ${{ runner.os }}-go-1.24-test-${{ hashFiles('**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-go-1.24-test-

    - name: Run tests
      run: go test -v -timeout 5m ./...