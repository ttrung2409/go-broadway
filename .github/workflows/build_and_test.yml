name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=3m

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Check out code
      uses: actions/checkout@v3
      
    - name: Set up Go 1.24
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: true
        
    - name: Install dependencies
      run: go mod download
      
    - name: Build
      run: go build -v ./...
      
    - name: Build examples
      run: go build -v ./examples/...
      
    - name: Verify no build constraints are broken
      run: |
        go env -w CGO_ENABLED=0
        go build -v ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.24']

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install dependencies
      run: |
        go mod download
        go mod verify

    # Create a directory for test cache
    - name: Create test cache directory
      run: mkdir -p .test-cache

    # Cache test results between runs
    - uses: actions/cache@v3
      with:
        path: .test-cache
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-test-${{ hashFiles('**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-test-

    - name: Run tests with race detection
      run: go test -race -v -timeout 5m ./...